name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Unit tests and integration tests (real PostgreSQL in a container) plus the coverage check.
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Browser tests (E2E and Acceptance) need a running site, so they have their own jobs below.
      - name: Unit and integration tests
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --filter "Category!=E2E&Category!=Acceptance"
          --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Coverage of the business logic must stay at 70% or more
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"TextSummary;Html" \
            "-classfilters:+JobLens.Web.Services.*;+JobLens.Web.Data.SkillProfileExtensions"
          cat coverage-report/Summary.txt
          LINE=$(grep -oP 'Line coverage: \K[0-9.]+' coverage-report/Summary.txt | head -1)
          echo "Business logic line coverage: ${LINE}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v c="$LINE" 'BEGIN { if (c + 0 < 70) { print "Coverage " c "% is below the 70% target"; exit 1 } }'

      - name: Publish the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

  # End-to-end tests: the real container and database from docker compose, driven by a real browser.
  e2e:
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the tests
        run: dotnet build JobLens.Tests --configuration Release

      - name: Install the Playwright browser
        run: pwsh JobLens.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start the app and database
        run: |
          echo "POSTGRES_PASSWORD=ci-only-password" > .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 5
          done
          echo "The app never became healthy"
          exit 1

      - name: Run the end-to-end tests
        env:
          E2E_BASE_URL: http://localhost:8080
        run: dotnet test JobLens.Tests --no-build --configuration Release --filter "Category=E2E" --verbosity normal

      - name: Show the app logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop the app and database
        if: always()
        run: docker compose down -v

  # Builds the Docker image once build and tests pass.
  # On a pull request it only builds (proves the Dockerfile works).
  # After a merge to main it also pushes the image to GHCR, tagged with the commit ID.
  docker:
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.imageref.outputs.image }}
    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag = full commit ID, never reused, so any old image can be redeployed (rollback).
      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=

      - name: Compute image reference
        id: imageref
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LC}:${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Nothing is deployed unless the unit, integration and end-to-end tests have all passed.
  deploy-staging:
    needs: [docker, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy image to staging
        run: |
          az containerapp update \
            --name joblens-staging \
            --resource-group rg-joblens \
            --image ${{ needs.docker.outputs.image }}

      - name: Health check staging
        run: |
          URL="https://joblens-staging.wonderfulsmoke-b229f128.australiaeast.azurecontainerapps.io/Version"
          for i in $(seq 1 20); do
            if curl -fsS "$URL" | grep -q "${GITHUB_SHA}"; then
              echo "Staging is serving ${GITHUB_SHA}"
              exit 0
            fi
            echo "Attempt $i: not ready yet"
            sleep 15
          done
          echo "Staging never started serving ${GITHUB_SHA} - stopping before production"
          exit 1

  # System and acceptance tests against the live staging site. Production waits for these.
  acceptance-staging:
    needs: [docker, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the tests
        run: dotnet build JobLens.Tests --configuration Release

      - name: Install the Playwright browser
        run: pwsh JobLens.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run the acceptance tests against staging
        env:
          E2E_BASE_URL: https://joblens-staging.wonderfulsmoke-b229f128.australiaeast.azurecontainerapps.io
          EXPECTED_COMMIT: ${{ github.sha }}
        run: dotnet test JobLens.Tests --no-build --configuration Release --filter "Category=Acceptance" --verbosity normal

  deploy-production:
    needs: [docker, deploy-staging, acceptance-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Promote the same image to production
        run: |
          az containerapp update \
            --name joblens-production \
            --resource-group rg-joblens \
            --image ${{ needs.docker.outputs.image }}

      - name: Verify production
        run: |
          URL="https://joblens-production.wonderfulsmoke-b229f128.australiaeast.azurecontainerapps.io/health"
          for i in $(seq 1 20); do
            if curl -fsS "$URL"; then
              echo "Production is healthy"
              exit 0
            fi
            sleep 15
          done
          exit 1
